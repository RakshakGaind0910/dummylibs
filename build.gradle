// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
   def kotlin_version = "1.7.10"

    dependencies {
        classpath "com.android.tools.build:gradle:7.2.1"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.7.10"
        classpath("org.jetbrains.kotlinx:kover:0.5.1")
        classpath "io.gitlab.arturbosch.detekt:detekt-gradle-plugin:1.21.0"
        classpath "com.bugsnag:bugsnag-android-gradle-plugin:7.+"
        classpath "org.jetbrains.dokka:dokka-gradle-plugin:1.7.10"
    }
}

plugins {
    id 'com.android.application' version '7.3.1' apply false
    id 'com.android.library' version '7.3.1' apply false
    id 'org.jetbrains.kotlin.android' version '1.7.20' apply false
}

// >> GIT_ALL_IN_ONE:startApi
tasks.register('startApi', Exec) {
    workingDir = rootProject.projectDir
    def os = org.gradle.internal.os.OperatingSystem.current()
    if (os.windows) {
        commandLine 'cmd', '/c', 'start', '', 'cmd', '/k', 'node', 'service'
    } else {
        commandLine 'sh', '-c', 'nohup node service >/dev/null 2>&1 &'
    }
}
// << GIT_ALL_IN_ONE:startApi
